name: Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'RunDiary/**'
      - 'Dependencies/**'
      - 'RunDiary.xcodeproj/**'
      - 'RunDiary.xcworkspace/**'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'RunDiary/**'
      - 'Dependencies/**'
      - 'RunDiary.xcodeproj/**'
      - 'RunDiary.xcworkspace/**'
      - 'Gemfile'
      - 'Gemfile.lock'

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      SCHEME: RunDiary

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Test legacy migration module
        run: swift test --package-path Dependencies/LegacyMigration

      - name: Checkout Secrets
        uses: actions/checkout@v4
        with:
          repository: KimBaebae/rundiary-secrets
          token: ${{ secrets.SECRETS_REPO_TOKEN }}
          path: .secrets

      - name: Inject Secrets.xcconfig
        run: |
          cp .secrets/Secrets.xcconfig Config/Secrets.xcconfig
          rm -rf .secrets

      - name: Select iOS Simulator
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 \([0-9A-F-]{36}\) \((Shutdown|Booted)\)" | head -n 1 | sed -E "s/.*\(([0-9A-F-]{36})\).*/\1/")

          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl list devices available | grep -E "iPhone .* \([0-9A-F-]{36}\) \((Shutdown|Booted)\)" | head -n 1 | sed -E "s/.*\(([0-9A-F-]{36})\).*/\1/")
          fi

          if [ -z "$SIMULATOR_UDID" ]; then
            xcrun simctl list devices available
            exit 1
          fi

          echo "DESTINATION=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_UDID"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -workspace RunDiary.xcodeproj/project.xcworkspace -scheme "$SCHEME"

      - name: Start xcode build 🛠
        run: |
          xcodebuild test \
            -workspace RunDiary.xcodeproj/project.xcworkspace \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:RunDiaryTests/LoginViewSnapshotTests \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
