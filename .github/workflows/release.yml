name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'TestFlight에서 검증한 전체 소스 SHA'
        required: true
        type: string
      app_version:
        description: '검증한 TestFlight 버전 (예: 1.3.0)'
        required: true
        type: string
      build_number:
        description: '검증한 TestFlight 빌드 번호'
        required: true
        type: string
      testflight_run_id:
        description: '해당 빌드를 업로드한 성공한 Testflight Actions run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-delivery
  cancel-in-progress: false

jobs:
  submit-appstore:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git diff --exit-code "$WORKFLOW_SHA" "$CANDIDATE_SHA" -- .github/workflows/testflight.yml .github/workflows/release.yml fastlane/Fastfile Scripts/verify_delivery.py

      - name: Verify successful candidate CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          mkdir -p .release-evidence
          gh api "repos/$GH_REPO/actions/workflows/build-and-test.yml/runs?head_sha=$CANDIDATE_SHA&branch=main&per_page=100" > .release-evidence/ci.json
          python3 Scripts/verify_delivery.py ci --evidence .release-evidence/ci.json --sha "$CANDIDATE_SHA"

      - name: Verify TestFlight run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTFLIGHT_RUN_ID: ${{ inputs.testflight_run_id }}
        run: |
          [[ "$TESTFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$TESTFLIGHT_RUN_ID" > .release-evidence/run.json
          python3 Scripts/verify_delivery.py run --evidence .release-evidence/run.json --run-id "$TESTFLIGHT_RUN_ID"

      - name: Download build identity
        uses: actions/download-artifact@v4
        with:
          name: ios-build-identity
          path: .release-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.testflight_run_id }}

      - name: Verify build identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          TESTFLIGHT_RUN_ID: ${{ inputs.testflight_run_id }}
        run: |
          python3 Scripts/verify_delivery.py identity --evidence .release-evidence/build-identity.json --run .release-evidence/run.json --run-id "$TESTFLIGHT_RUN_ID" --sha "$CANDIDATE_SHA" --version "$APP_VERSION" --build "$BUILD_NUMBER"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Submit the verified existing build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          RELEASE_APP_VERSION: ${{ inputs.app_version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: bundle exec fastlane release
